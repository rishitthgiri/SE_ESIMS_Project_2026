<form method="post" novalidate>
  {% csrf_token %}
  {% if form.non_field_errors %}
  <div class="alert alert-danger">{% for e in form.non_field_errors %}{{ e }}{% endfor %}</div>
  {% endif %}
  {% for field in form %}
  <div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% for e in field.errors %}<div class="text-danger small mt-1">{{ e }}</div>{% endfor %}
  </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">{{ button }}</button>
  <a href="{% url 'transactions:list' %}" class="btn btn-outline-secondary">Cancel</a>
</form>
