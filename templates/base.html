<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ESIMS{% endblock %} | Electronics Store Inventory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'accounts:dashboard' %}">ESIMS</a>
    {% if user.is_authenticated %}
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link" href="{% url 'accounts:dashboard' %}">Dashboard</a></li>
    </ul>
    <span class="navbar-text me-3">{{ user.username }} ({{ user.get_role_display }})</span>
    <form method="post" action="{% url 'accounts:logout' %}" class="d-inline">
      {% csrf_token %}
      <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
    </form>
    {% endif %}
  </div>
</nav>
<main class="container">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
